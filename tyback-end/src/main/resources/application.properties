# MySQL local por defecto. Para deploy se pueden definir DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/la_yeya?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La estructura se importa desde database/la_yeya_seed.sql. Hibernate solo utiliza las tablas existentes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Pre-deploy: el proveedor puede inyectar PORT y FRONTEND_ORIGINS sin modificar el código.
server.port=${PORT:8080}
app.frontend-origins=${FRONTEND_ORIGINS:http://127.0.0.1:5500,http://127.0.0.1:5501,http://127.0.0.1:5502,http://127.0.0.1:5503,http://localhost:5500,http://localhost:5501,http://localhost:5502,http://localhost:5503}
