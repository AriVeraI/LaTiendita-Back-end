spring.application.name=tyback-end

spring.datasource.url=jdbc:mysql://${PROD_DB_HOST:localhost}:3306/${PROD_DB_NAME:la_yeya}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:Cristian3312}

spring.jpa.hibernate.ddl-auto=${PROD_DDL:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.port=${PORT:8080}

# Limitar el pool de conexiones de Spring Boot a un máximo de 2 o 3
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000